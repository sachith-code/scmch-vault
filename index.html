<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>College Memory Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--text:#f3f4f6;--muted:#9fb0c6;--accent:#38bdf8;--glass:rgba(10,20,34,.8);--edge:rgba(255,255,255,.12);--field:#0b1626;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#04121a;color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.layer{position:relative;z-index:1}
.hidden{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:1.25rem;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
header{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--edge);padding:calc(.7rem + env(safe-area-inset-top,0px)) 1rem .7rem}
header .in{max-width:38rem;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.brand b{display:block;font-size:.9rem;font-weight:800}
.brand span{font-size:.72rem;color:var(--accent);font-weight:700}
.row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.btn{border:1px solid var(--edge);background:var(--field);padding:.5rem .9rem;border-radius:.8rem;font-weight:700;font-size:.8rem;cursor:pointer}
.btn.main{background:var(--accent);border-color:transparent;color:#04121a}
.btn:hover{filter:brightness(1.15)}.btn:disabled{opacity:.5}
main{max-width:38rem;margin:0 auto;padding:1.2rem 1rem calc(3rem + env(safe-area-inset-bottom,0px))}
#login{max-width:25rem;margin:9vh auto 0;padding:1.8rem}
#login h1{margin:.2rem 0;font-size:1.4rem;text-align:center}
#login .tag{color:var(--muted);font-size:.88rem;text-align:center;margin:0 0 1.2rem}
.tabs{display:flex;gap:.3rem;background:var(--field);padding:.25rem;border-radius:.9rem;margin-bottom:1.1rem}
.tabs button{flex:1;border:0;background:none;padding:.5rem;border-radius:.7rem;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected=true]{background:#1b2c44;color:#fff}
label{display:block;font-size:.76rem;font-weight:700;margin:.8rem 0 .3rem}
input,textarea,select{width:100%;background:var(--field);border:1px solid var(--edge);border-radius:.8rem;padding:.6rem .8rem;font-size:.88rem}
.chip{display:flex;align-items:center;gap:.6rem;padding:.6rem;border:1px solid var(--edge);border-radius:.9rem;margin-bottom:.4rem;font-size:.82rem;overflow-wrap:anywhere}
.chip img{width:2rem;height:2rem;border-radius:50%}
.err{color:#fda4af;font-size:.8rem;margin-top:.6rem}
.ok{color:#86efac;font-size:.8rem;margin-top:.6rem}
.wide{width:100%;margin-top:1rem;padding:.75rem}
.notice{padding:1rem;border:1px solid #f43f5e;border-radius:1rem;font-size:.85rem;margin-bottom:1rem;background:rgba(244,63,94,.12)}
.post{margin-bottom:1.2rem;overflow:hidden}
.post .head{display:flex;align-items:center;gap:.7rem;padding:.9rem 1rem}
.post .head .del{margin-left:auto}
.av{width:2.2rem;height:2.2rem;border-radius:50%;object-fit:cover;border:1px solid var(--edge)}
.who{font-weight:700;font-size:.85rem}.when{font-size:.72rem;color:var(--muted)}
.photo{display:block;width:100%;max-height:30rem;object-fit:cover;background:#000}
.song{display:block;width:100%;height:200px;border:0;background:#000}
.body{padding:.9rem 1rem 1rem}
.cap{font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere;margin:.4rem 0 .8rem}
.like{background:none;border:0;cursor:pointer;font-size:1.05rem;padding:0;color:var(--muted)}
.like.on{color:#fb7185}
.comments{border-top:1px solid var(--edge);margin-top:.8rem;padding-top:.7rem;font-size:.82rem;overflow-wrap:anywhere}
.comments p{margin:0 0 .35rem;color:#cbd5e1}.comments b{color:var(--text)}
.cform{display:flex;gap:.5rem;margin-top:.5rem}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--muted)}
dialog{border:1px solid var(--edge);background:#0a1424;color:var(--text);border-radius:1.25rem;padding:1.3rem;width:min(32rem,calc(100% - 2rem));max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{margin:0 0 .6rem;font-size:1.05rem}
dialog h3{margin:1.2rem 0 .2rem;font-size:.9rem}
#prev{max-width:100%;max-height:13rem;border-radius:.8rem;margin-top:.6rem}
.mem{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.55rem 0;border-bottom:1px solid var(--edge);font-size:.8rem}
.mem small{display:block;color:var(--muted);overflow-wrap:anywhere}
.ring{padding:2px;border-radius:50%;background:linear-gradient(45deg,#f9a825,#ef4444,#c026d3,#7c3aed);display:grid}
.ring .av{border:2px solid #0a1424;width:2.3rem;height:2.3rem}
.ini{width:2.3rem;height:2.3rem;border-radius:50%;background:#1b2c44;display:grid;place-items:center;font-weight:800;border:2px solid #0a1424}
.tick{width:.95rem;height:.95rem;vertical-align:-.15rem;margin-left:.3rem}
.pics{position:relative}
.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip img{flex:0 0 100%;scroll-snap-align:center;width:100%;aspect-ratio:1/1;object-fit:cover;background:#000}
.acts{display:flex;align-items:center;gap:1rem;padding:.8rem 1rem 0}
.acts button{background:none;border:0;padding:0;cursor:pointer;color:var(--text);display:grid}
.acts svg{width:1.6rem;height:1.6rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.acts .on svg{fill:#ef4444;stroke:#ef4444}
.dots{flex:1;display:flex;justify-content:center;gap:.3rem}
.dots i{width:.4rem;height:.4rem;border-radius:50%;background:#475569}
.dots i.cur{background:var(--accent)}
.likes{font-weight:700;font-size:.85rem}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.burst svg{width:5rem;height:5rem;fill:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.burst.go{animation:pop .7s}
@keyframes pop{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{flex:1;background:none;border:0;padding:.65rem .3rem;color:var(--muted);font-weight:700;font-size:.72rem;cursor:pointer;display:grid;justify-items:center;gap:.15rem}
#tabs button[aria-current=page]{color:var(--accent)}
#tabs svg{width:1.4rem;height:1.4rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding-bottom:calc(5.5rem + env(safe-area-inset-bottom,0px))}
.prow{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;margin-bottom:.6rem;width:100%;text-align:left;color:var(--text)}
.pname{flex:1;min-width:0;font-size:.88rem}
.pname small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#q{margin-bottom:.8rem}
#msgs{height:55vh;overflow-y:auto;padding:.8rem;display:flex;flex-direction:column;gap:.4rem}
.bub{max-width:80%;padding:.5rem .8rem;border-radius:1rem;font-size:.88rem;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--accent);color:#04121a}
.bub.them{align-self:flex-start;background:#1b2c44}
#chat .cform{padding:.7rem;border-top:1px solid var(--edge);margin:0}
.toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#04121a;padding:.6rem 1rem;border-radius:.8rem;font-size:.85rem;font-weight:700;z-index:50}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="layer">
<header class="hidden" id="bar"><div class="in">
  <div class="brand"><b class="siteTitle">College Memory Vault</b><span id="who"></span></div>
  <div class="row"><button class="btn main" id="newBtn">New post</button><button class="btn hidden" id="admBtn">Admin</button><button class="btn" id="outBtn">Sign out</button></div>
</div></header>

<main>
  <div class="notice hidden" id="setup"><b>Setup needed.</b> Open index.html in a text editor and paste your Firebase details into the CONFIG block.</div>

  <section id="login" class="glass">
    <h1 class="siteTitle">College Memory Vault</h1>
    <p class="tag" id="tagline">Share your college memories with your batch.</p>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabS" aria-selected="true">Student</button>
      <button role="tab" id="tabA" aria-selected="false">Admin</button>
    </div>

    <div id="stu">
      <div id="step1"><button class="btn main wide" id="gBtn" style="margin-top:0">Sign in with Google</button></div>
      <div id="step2" class="hidden">
        <div class="chip"><img id="gpic" alt=""><div><b id="gname"></b><br><span id="gmail"></span></div></div>
        <label for="code">Batch passcode</label>
        <input type="password" id="code" autocomplete="off">
        <button class="btn main wide" id="enterBtn">Enter</button>
        <button class="btn wide" id="otherBtn" style="margin-top:.5rem">Use a different account</button>
      </div>
    </div>

    <form id="adm" class="hidden">
      <label for="au">Admin username</label><input type="text" id="au" autocomplete="username" required>
      <label for="ap">Admin password</label><input type="password" id="ap" autocomplete="current-password" required>
      <button class="btn main wide" type="submit">Log in as admin</button>
    </form>
    <div class="err" id="lerr" role="alert"></div>
  </section>

  <section id="feed" class="hidden"></section>

  <section id="searchView" class="hidden">
    <input type="text" id="q" placeholder="Search people by username" aria-label="Search people by username" autocomplete="off">
    <div id="people"></div>
  </section>

  <section id="msgView" class="hidden">
    <div id="inbox"></div>
    <div id="chat" class="glass hidden">
      <div class="row" style="padding:.8rem"><button class="btn" id="back" type="button">Back</button><b id="chatName"></b></div>
      <div id="msgs" aria-live="polite"></div>
      <form id="mform" class="cform"><input type="text" id="mtext" maxlength="1000" required placeholder="Write a message" aria-label="Write a message"><button class="btn main" type="submit">Send</button></form>
    </div>
  </section>
</main>
</div>

<nav id="tabs" class="hidden" aria-label="Sections">
  <button type="button" data-v="feed" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/></svg>Home</button>
  <button type="button" data-v="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Search</button>
  <button type="button" data-v="msgs"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 6l9 7 9-7"/></svg>Messages</button>
</nav>

<dialog id="dlg">
  <h2>New memory</h2>
  <form id="pform">
    <label for="file">Photos (up to 3, optional)</label>
    <input type="file" id="file" accept="image/*" multiple>
    <div id="prevs" class="row" style="margin-top:.6rem"></div>
    <label for="cap">Your thoughts</label>
    <textarea id="cap" rows="4" maxlength="500" required></textarea>
    <label for="song">Song: paste a YouTube link (optional)</label>
    <input type="text" id="song" placeholder="https://www.youtube.com/watch?v=...">
    <div class="err" id="perr" role="alert"></div>
    <div class="row" style="justify-content:flex-end;margin-top:1rem">
      <button type="button" class="btn" id="cancel">Cancel</button>
      <button type="submit" class="btn main" id="pub">Publish</button>
    </div>
  </form>
</dialog>

<dialog id="panel">
  <div class="row" style="justify-content:space-between"><h2>Admin panel</h2><button class="btn" id="closeP">Close</button></div>
  <h3>Student passcode</h3>
  <div class="row" style="flex-wrap:nowrap"><input type="text" id="pc" placeholder="New passcode"><button class="btn main" id="savePc">Save</button></div>
  <h3>Site look</h3>
  <label for="st">Site name</label><input type="text" id="st" maxlength="60">
  <label for="sg">Tagline</label><input type="text" id="sg" maxlength="120">
  <label for="sb">Background</label>
  <select id="sb"><option value="theatre">Operation theatre</option><option value="stars">Starfield</option><option value="plain">Plain dark</option></select>
  <label for="sa">Accent colour</label><input type="color" id="sa" value="#38bdf8" style="height:2.4rem;padding:.2rem">
  <button class="btn main wide" id="saveSite">Save site look</button>
  <div class="ok" id="pmsg" role="status"></div>
  <h3>People who logged in</h3>
  <div id="members"></div>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,setDoc,query,orderBy,limit,where,onSnapshot,doc,updateDoc,deleteDoc,arrayUnion,arrayRemove,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== CONFIG: paste your own values ====== */
const CONFIG = {apiKey:"AIzaSyCBzYWfg-9PsIf41g4cq5axF5z_P_BxgX4",authDomain:"scmch-vault.firebaseapp.com",projectId:"scmch-vault",appId:"1:262025222572:web:47aa35443b875b520bc209"};
const ADMIN_USERNAME = "sachith p gowda";
const ADMIN_EMAIL = "admin@scmch.app"; // the admin account you create in Firebase
/* =========================================== */

const $ = id => document.getElementById(id);
const el = (t,c,x) => { const e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e; };

/* ---------- Background animation ---------- */
const cv=$("bg"), cx=cv.getContext("2d"), still=matchMedia("(prefers-reduced-motion:reduce)").matches;
let W,H,t=0,scene="rain",mode="theatre",drops=[],rip=[],clouds=[],plus=[],stars=[];
const R=Math.random;
function fit(){W=cv.width=innerWidth;H=cv.height=innerHeight;if(still)draw()}
for(let i=0;i<8;i++)clouds.push({x:R()*innerWidth,y:25+R()*45,s:.6+R()*.6,v:.12+R()*.2});
for(let i=0;i<20;i++)plus.push({x:R(),y:R(),s:4+R()*6,v:.0003+R()*.0005});
for(let i=0;i<120;i++)stars.push({x:R(),y:R(),r:R()*1.4,a:R()});
function back(a,b){const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,a);g.addColorStop(1,b);cx.fillStyle=g;cx.fillRect(0,0,W,H)}
function rain(){
  back("#07111f","#0c2a4a");
  cx.fillStyle="rgba(170,185,205,.38)";
  clouds.forEach(c=>{
    if(!still){c.x+=c.v;if(c.x>W+120)c.x=-120}
    [[0,0,38],[34,-12,30],[66,0,36],[30,10,32]].forEach(([dx,dy,r])=>{cx.beginPath();cx.arc(c.x+dx*c.s,c.y+dy*c.s,r*c.s,0,6.283);cx.fill()});
    if(!still&&R()<.05)drops.push({x:c.x+(10+R()*70)*c.s,y:c.y+30*c.s,vy:2+R()*2,r:1.6+R()*1.6,f:H-30-R()*70});
  });
  drops=drops.filter(d=>{d.vy+=.18;d.y+=d.vy;
    cx.fillStyle="rgba(125,211,252,.85)";cx.beginPath();cx.moveTo(d.x,d.y-d.r*3);cx.quadraticCurveTo(d.x+d.r*1.6,d.y,d.x,d.y+d.r);cx.quadraticCurveTo(d.x-d.r*1.6,d.y,d.x,d.y-d.r*3);cx.fill();
    if(d.y>=d.f){rip.push({x:d.x,y:d.f,r:2,a:.8});return false}return true});
  rip=rip.filter(p=>{p.r+=1.6;p.a-=.016;cx.strokeStyle="rgba(186,230,253,"+Math.max(p.a,0)+")";cx.lineWidth=1.4;cx.beginPath();cx.ellipse(p.x,p.y,p.r,p.r*.35,0,0,6.283);cx.stroke();return p.a>0});
}
function ecg(p){if(p>.08&&p<.18)return -.12*Math.sin((p-.08)/.1*Math.PI);if(p>.28&&p<.31)return .15*(p-.28)/.03;if(p>=.31&&p<.35)return .15-1.15*(p-.31)/.04;if(p>=.35&&p<.39)return -1+1.3*(p-.35)/.04;if(p>=.39&&p<.41)return .3-.3*(p-.39)/.02;if(p>.5&&p<.64)return -.22*Math.sin((p-.5)/.14*Math.PI);return 0}
function theatre(){
  back("#04121a","#0a2a30");
  [.3,.7].forEach((p,i)=>{
    const x=W*p+Math.sin(t/170+i*2)*14,g=cx.createRadialGradient(x,50,8,x,50,Math.max(H,W*.5)*.8);
    g.addColorStop(0,"rgba(200,245,240,.34)");g.addColorStop(1,"rgba(200,245,240,0)");cx.fillStyle=g;cx.fillRect(0,0,W,H);
    cx.fillStyle="#e6fbf8";cx.beginPath();cx.arc(x,34,24,0,6.283);cx.fill();
    cx.strokeStyle="#7dd3c8";cx.lineWidth=3;cx.beginPath();cx.arc(x,34,30,0,6.283);cx.stroke();
  });
  cx.strokeStyle="rgba(167,243,208,.35)";cx.lineWidth=2;
  plus.forEach(q=>{if(!still){q.y-=q.v;if(q.y<-.05)q.y=1.05}const x=q.x*W,y=q.y*H;cx.beginPath();cx.moveTo(x-q.s,y);cx.lineTo(x+q.s,y);cx.moveTo(x,y-q.s);cx.lineTo(x,y+q.s);cx.stroke()});
  const y0=H*.84,amp=Math.min(H*.08,70);
  cx.strokeStyle="#34d399";cx.lineWidth=2.2;cx.shadowColor="#34d399";cx.shadowBlur=10;cx.beginPath();
  for(let x=0;x<=W;x+=3){const y=y0+ecg((((x+t*2.6)%360)+360)%360/360)*amp;x?cx.lineTo(x,y):cx.moveTo(x,y)}
  cx.stroke();cx.shadowBlur=0;
}
function starfield(){back("#030712","#0b1226");stars.forEach(s=>{if(!still)s.a=Math.max(.2,Math.min(1,s.a+(R()-.5)*.03));cx.fillStyle="rgba(255,255,255,"+s.a+")";cx.beginPath();cx.arc(s.x*W,s.y*H,s.r,0,6.283);cx.fill()})}
function racing(){
  back("#05060a","#14111a");
  const hy=H*.55;
  const glow=cx.createLinearGradient(0,hy-80,0,hy+60);
  glow.addColorStop(0,"rgba(255,70,40,0)");glow.addColorStop(.5,"rgba(255,70,40,.28)");glow.addColorStop(1,"rgba(255,70,40,0)");
  cx.fillStyle=glow;cx.fillRect(0,hy-80,W,140);
  cx.fillStyle="#0c0d12";cx.fillRect(0,hy,W,H-hy);
  cx.strokeStyle="rgba(255,255,255,.22)";cx.lineWidth=2;
  for(let i=-6;i<=6;i++){
    cx.beginPath();cx.moveTo(W/2+i*W*0.02,hy);cx.lineTo(W/2+i*W*0.2,H);cx.stroke();
  }
  for(let r=0;r<12;r++){
    const p=((t*0.012)+r/12)%1,y=hy+(H-hy)*p*p,w=3+p*14;
    cx.fillStyle="rgba(255,255,255,"+(0.2+p*0.6)+")";
    cx.fillRect(W/2-w/2,y,w,4+p*30);
  }
  const cars=[{l:-1,c:"#ef4444",o:0},{l:0,c:"#3b82f6",o:.33},{l:1,c:"#facc15",o:.66}];
  cars.map(k=>{const p=(t*0.004*(1+k.l*0.1)+k.o)%1;return {k,p}}).sort((a,b)=>a.p-b.p).forEach(({k,p})=>{
    const s=0.15+p*1.1,x=W/2+k.l*(W*0.05+p*W*0.22),y=hy+(H-hy)*(0.1+p*0.8);
    car(x,y,s,k.c);
  });
  cx.fillStyle="rgba(0,0,0,.6)";cx.fillRect(0,H-6,W,6);
}
function car(x,y,s,col){
  cx.save();cx.translate(x,y);cx.scale(s,s);
  cx.fillStyle="rgba(0,0,0,.5)";cx.beginPath();cx.ellipse(0,22,60,10,0,0,6.283);cx.fill();
  cx.fillStyle="#111";cx.fillRect(-52,6,18,18);cx.fillRect(34,6,18,18);
  cx.fillStyle=col;cx.beginPath();cx.moveTo(-46,10);cx.lineTo(-30,-6);cx.lineTo(30,-6);cx.lineTo(46,10);cx.lineTo(46,22);cx.lineTo(-46,22);cx.closePath();cx.fill();
  cx.fillStyle="#0b0d12";cx.beginPath();cx.moveTo(-18,-6);cx.lineTo(-10,-18);cx.lineTo(10,-18);cx.lineTo(18,-6);cx.closePath();cx.fill();

  cx.fillStyle=col;cx.fillRect(-56,-14,112,6);
  cx.fillStyle="#fff8e0";cx.shadowColor="#fff8e0";cx.shadowBlur=14;cx.fillRect(-46,12,10,4);cx.fillRect(36,12,10,4);cx.shadowBlur=0;
  cx.restore();
}
function draw(){cx.clearRect(0,0,W,H);if(scene==="rain")racing();else if(mode==="theatre")theatre();else if(mode==="stars")starfield();else back("#05080f","#0d1424")}
function loop(){t++;draw();requestAnimationFrame(loop)}
addEventListener("resize",fit);fit();if(!still)loop();

/* ---------- Firebase ---------- */
if(CONFIG.apiKey.startsWith("PASTE")){$("setup").classList.remove("hidden");$("gBtn").disabled=true;throw new Error("Firebase not configured")}
const app=initializeApp(CONFIG),auth=getAuth(app),db=getFirestore(app);
let me=null,unlocked=false,unsubFeed=null,unsubM=null,unsubB=null,photos=[],unsubP=null,unsubF=null,unsubI=null,unsubChat=null,people=[],following=new Set(),convs=[],chatWith=null,chatErr=false,view="feed",members=[],bans=new Set();
const isAdmin=()=>!!me&&me.email===ADMIN_EMAIL;

/* ---------- Login ---------- */
function tab(a){$("tabS").setAttribute("aria-selected",!a);$("tabA").setAttribute("aria-selected",a);$("stu").classList.toggle("hidden",a);$("adm").classList.toggle("hidden",!a);$("lerr").textContent=""}
$("tabS").onclick=()=>tab(false);$("tabA").onclick=()=>tab(true);
$("gBtn").onclick=async()=>{$("lerr").textContent="";try{await signInWithPopup(auth,new GoogleAuthProvider())}catch{$("lerr").textContent="Google sign-in failed. Please try again."}};
$("otherBtn").onclick=()=>signOut(auth);
$("enterBtn").onclick=async()=>{
  $("lerr").textContent="";
  try{
    await setDoc(doc(db,"members",me.uid),{name:me.displayName||"Student",email:me.email||"",photo:me.photoURL||"",code:$("code").value,last:serverTimestamp()},{merge:true});

$("outBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth,u=>{me=u;if(!u)unlocked=false;route()});
function route(){
  const inApp=!!me&&(isAdmin()||unlocked);
  scene=inApp?"app":"rain";if(still)draw();
  $("login").classList.toggle("hidden",inApp);
  $("bar").classList.toggle("hidden",!inApp);
  $("tabs").classList.toggle("hidden",!inApp);show(inApp?view:"");
  const g=!!me&&!isAdmin()&&!unlocked;
  $("step1").classList.toggle("hidden",g);$("step2").classList.toggle("hidden",!g);
  if(g){$("gpic").src=me.photoURL||"";$("gpic").referrerPolicy="no-referrer";$("gname").textContent=me.displayName||"Student";$("gmail").textContent=me.email||""}
  [unsubFeed,unsubM,unsubB,unsubP,unsubF,unsubI,unsubChat].forEach(f=>f&&f());unsubFeed=unsubM=unsubB=unsubP=unsubF=unsubI=unsubChat=null;
  chatWith=null;$("chat").classList.add("hidden");$("inbox").classList.remove("hidden");
  $("admBtn").classList.toggle("hidden",!(inApp&&isAdmin()));
  if(inApp){
    $("who").textContent=isAdmin()?"Admin":(me.displayName||"Student");
    const nm=isAdmin()?"Admin":(me.displayName||"Student");
    setDoc(doc(db,"profiles",me.uid),{name:nm,nameLower:nm.toLowerCase(),photo:me.photoURL||"",adm:isAdmin()}).catch(()=>{});
    unsubP=onSnapshot(collection(db,"profiles"),s=>{people=s.docs.map(d=>({id:d.id,...d.data()}));drawPeople();drawInbox()},()=>{});
    unsubF=onSnapshot(query(collection(db,"follows"),where("from","==",me.uid)),s=>{following=new Set(s.docs.map(d=>d.data().to));drawPeople()},()=>{});
    unsubI=onSnapshot(query(collection(db,"dms"),where("members","array-contains",me.uid)),s=>{convs=s.docs.map(d=>({id:d.id,...d.data()}));drawInbox()},()=>{});
    unsubFeed=onSnapshot(query(collection(db,"posts"),orderBy("createdAt","desc"),limit(50)),
      s=>render(s.docs.map(d=>({id:d.id,...d.data()}))),
      ()=>$("feed").replaceChildren(el("div","glass empty","Could not load posts. You may have been removed, or the Firestore rules are not set.")));
  }
}

/* ---------- Feed ---------- */
function render(posts){
  const f=$("feed");f.replaceChildren();
  if(!posts.length){f.append(el("div","glass empty","No memories yet. Be the first to post."));return}
  posts.forEach(p=>f.append(card(p)));
}
const IC={heart:'<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.5 6.4 4.5c2.1 0 3.9 1.2 5.6 3.3 1.7-2.1 3.5-3.3 5.6-3.3 3.7 0 5.5 3.9 4 7.3C19.5 16.4 12 21 12 21z"/></svg>',chat:'<svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.6L3 20.5l1.5-5.2A8.5 8.5 0 1 1 21 11.5z"/></svg>',send:'<svg viewBox="0 0 24 24"><path d="M22 3 2 10.5l7.5 3L12.5 21zM9.5 13.5 22 3"/></svg>',tick:'<svg class="tick" viewBox="0 0 24 24" aria-label="Admin"><circle cx="12" cy="12" r="11" fill="#1d9bf0"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
function icon(k,cls,label,fn){const b=el("button",cls);b.type="button";b.innerHTML=IC[k];b.setAttribute("aria-label",label);b.onclick=fn;return b}
function toast(t){const x=el("div","toast",t);x.setAttribute("role","status");document.body.append(x);setTimeout(()=>x.remove(),2200)}
function when(d){return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})+" · "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}
async function share(p,imgs){
  const url=location.href.split("#")[0],text=(p.name||"A friend")+" shared a memory: "+(p.caption||"").slice(0,120);
  try{
    if(imgs[0]&&navigator.canShare){
      const blob=await (await fetch(imgs[0])).blob(),f=new File([blob],"memory.jpg",{type:"image/jpeg"});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f],text:text+"\n"+url});return}
    }
    if(navigator.share){await navigator.share({text:text,url:url});return}
    await navigator.clipboard.writeText(text+" "+url);toast("Link copied")
  }catch(e){
    if(e&&e.name==="AbortError")return;
    try{await navigator.clipboard.writeText(url);toast("Link copied")}catch{toast("Could not share")}
  }
}
function card(p){
  const imgs=p.images&&p.images.length?p.images:(p.image?[p.image]:[]);
  const likes=p.likes||[],liked=likes.includes(me.uid);
  const c=el("article","glass post"),h=el("div","head"),ring=el("div","ring");
  if(p.avatar){const im=el("img","av");im.src=p.avatar;im.alt="";im.referrerPolicy="no-referrer";ring.append(im)}
  else ring.append(el("div","ini",(p.name||"S").charAt(0).toUpperCase()));
  const m=el("div"),w=el("div","who",p.name||"Student");
  if(p.adm)w.insertAdjacentHTML("beforeend",IC.tick);
  m.append(w,el("div","when",p.createdAt?when(p.createdAt.toDate()):"Just now"));
  h.append(ring,m);
  if(p.uid===me.uid||isAdmin()){const d=el("button","btn del","Delete");d.onclick=()=>{if(confirm("Delete this post?"))deleteDoc(doc(db,"posts",p.id))};h.append(d)}
  c.append(h);
  const like=()=>updateDoc(doc(db,"posts",p.id),{likes:liked?arrayRemove(me.uid):arrayUnion(me.uid)});
  let dots=null;
  if(imgs.length){
    const pics=el("div","pics"),strip=el("div","strip"),burst=el("div","burst");
    burst.innerHTML=IC.heart;
    imgs.forEach((s,i)=>{const im=el("img");im.src=s;im.alt="Photo "+(i+1)+" shared by "+(p.name||"a student");strip.append(im)});
    let last=0;
    strip.onclick=()=>{const n=Date.now();if(n-last<350){burst.classList.remove("go");void burst.offsetWidth;burst.classList.add("go");if(!liked)like()}last=n};
    pics.append(strip,burst);c.append(pics);
    if(imgs.length>1){
      dots=el("div","dots");imgs.forEach((_,i)=>dots.append(el("i",i?"":"cur")));
      strip.onscroll=()=>{const i=Math.round(strip.scrollLeft/strip.clientWidth);[...dots.children].forEach((d,k)=>d.className=k===i?"cur":"")};
    }
  }
  if(p.song){const s=el("iframe","song");s.src="https://www.youtube-nocookie.com/embed/"+p.song;s.title="Song";s.loading="lazy";s.allow="encrypted-media";s.allowFullscreen=true;c.append(s)}
  const acts=el("div","acts"),inp=el("input");
  acts.append(icon("heart",liked?"on":"","Like",like),icon("chat","","Comment",()=>inp.focus()),icon("send","","Share",()=>share(p,imgs)));
  if(dots)acts.append(dots);
  c.append(acts);
  const b=el("div","body"),cap=el("div","cap");
  cap.append(el("b",null,(p.name||"Student")+" "),document.createTextNode(p.caption||""));
  const cm=el("div","comments");
  (p.comments||[]).forEach(x=>{const r=el("p");r.append(el("b",null,(x.name||"Student")+": "),document.createTextNode(x.text));cm.append(r)});
  const f=el("form","cform");inp.type="text";inp.maxLength=300;inp.required=true;inp.placeholder="Add a comment";inp.setAttribute("aria-label","Add a comment");
  const bt=el("button","btn","Post");bt.type="submit";f.append(inp,bt);
  f.onsubmit=async e=>{e.preventDefault();const x=inp.value.trim();if(!x)return;inp.value="";
    await updateDoc(doc(db,"posts",p.id),{comments:arrayUnion({uid:me.uid,name:isAdmin()?"Admin":(me.displayName||"Student"),text:x,t:Date.now()})})};
  cm.append(f);
  b.append(el("div","likes",likes.length+(likes.length===1?" like":" likes")),cap,cm);c.append(b);return c;
}
function cardOld(p){
  const c=el("article","glass post"),h=el("div","head"),av=el("img","av");
  av.src=p.avatar||"";av.alt="";av.referrerPolicy="no-referrer";
  const m=el("div");m.append(el("div","who",p.name||"Student"),el("div","when",p.createdAt?p.createdAt.toDate().toLocaleDateString():"Just now"));
  h.append(av,m);
  if(me&&(p.uid===me.uid||isAdmin())){const d=el("button","btn del","Delete");d.onclick=()=>{if(confirm("Delete this post?"))deleteDoc(doc(db,"posts",p.id))};h.append(d)}
  c.append(h);
  if(p.image){const i=el("img","photo");i.src=p.image;i.alt="Photo shared by "+(p.name||"a student");c.append(i)}
  if(p.song){const s=el("iframe","song");s.src="https://www.youtube-nocookie.com/embed/"+p.song;s.title="Song";s.loading="lazy";s.allow="encrypted-media";s.allowFullscreen=true;c.append(s)}
  const b=el("div","body"),likes=p.likes||[],liked=likes.includes(me.uid);
  const lk=el("button","like"+(liked?" on":""),(liked?"♥ ":"♡ ")+likes.length);lk.setAttribute("aria-label","Like");
  lk.onclick=()=>updateDoc(doc(db,"posts",p.id),{likes:liked?arrayRemove(me.uid):arrayUnion(me.uid)});
  b.append(lk,el("div","cap",p.caption||""));
  const cm=el("div","comments");
  (p.comments||[]).forEach(x=>{const r=el("p");r.append(el("b",null,(x.name||"Student")+": "),document.createTextNode(x.text));cm.append(r)});
  const f=el("form","cform"),inp=el("input");inp.type="text";inp.maxLength=300;inp.required=true;inp.placeholder="Reply";inp.setAttribute("aria-label","Reply");
  const bt=el("button","btn","Reply");bt.type="submit";f.append(inp,bt);
  f.onsubmit=async e=>{e.preventDefault();const x=inp.value.trim();if(!x)return;inp.value="";
    await updateDoc(doc(db,"posts",p.id),{comments:arrayUnion({uid:me.uid,name:isAdmin()?"Admin":(me.displayName||"Student"),text:x,t:Date.now()})})};
  cm.append(f);b.append(cm);c.append(b);return c;
}

/* ---------- New post ---------- */
$("newBtn").onclick=()=>{$("perr").textContent="";$("dlg").showModal()};
$("cancel").onclick=()=>$("dlg").close();
function shrink(file){return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{let m=900,o;do{const s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);o=c.toDataURL("image/jpeg",.7);m-=200}while(o.length>250000&&m>300);URL.revokeObjectURL(u);o.length>270000?no():ok(o)};
  img.onerror=no;img.src=u})}
$("file").onchange=async e=>{
  photos=[];$("prevs").replaceChildren();$("perr").textContent="";
  try{for(const f of [...e.target.files].slice(0,3)){const d=await shrink(f);photos.push(d);const im=el("img");im.src=d;im.alt="Selected photo preview";im.style.cssText="height:5rem;border-radius:.6rem";$("prevs").append(im)}}
  catch{$("perr").textContent="One of those photos could not be used.";photos=[];$("prevs").replaceChildren()}
};
function ytId(s){const m=s.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:""}
$("pform").onsubmit=async e=>{
  e.preventDefault();$("perr").textContent="";
  const link=$("song").value.trim(),id=link?ytId(link):"";
  if(link&&!id){$("perr").textContent="That does not look like a YouTube link.";return}
  $("pub").disabled=true;
  try{
    await addDoc(collection(db,"posts"),{uid:me.uid,name:isAdmin()?"Admin":(me.displayName||"Student"),avatar:me.photoURL||"",caption:$("cap").value.trim(),images:photos,image:"",song:id,adm:isAdmin(),likes:[],comments:[],createdAt:serverTimestamp()});
    $("pform").reset();photos=[];$("prevs").replaceChildren();$("dlg").close();
  }catch{$("perr").textContent="Could not publish. Check your connection."}
  $("pub").disabled=false;
};

/* ---------- Search, follow, messages ---------- */
function show(v){
  if(v)view=v;
  const map={feed:"feed",search:"searchView",msgs:"msgView"};
  Object.keys(map).forEach(k=>$(map[k]).classList.toggle("hidden",!v||k!==view));
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===view?"page":"false"));
  if(v==="search"||v==="msgs"){drawPeople();drawInbox()}
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>show(b.dataset.v));
const person=id=>people.find(x=>x.id===id)||{id,name:"Student",photo:""};
function avatar(x){const r=el("div","ring");if(x.photo){const i=el("img","av");i.src=x.photo;i.alt="";i.referrerPolicy="no-referrer";r.append(i)}else r.append(el("div","ini",(x.name||"S").charAt(0).toUpperCase()));return r}
function drawPeople(){
  const box=$("people");if(!me)return;box.replaceChildren();
  const q=$("q").value.trim().toLowerCase();
  const list=people.filter(x=>x.id!==me.uid&&(!q||(x.nameLower||"").includes(q))).sort((a,b)=>(a.nameLower||"").localeCompare(b.nameLower||"")).slice(0,60);
  if(!list.length){box.append(el("div","glass empty",q?"No one found with that name.":"No other students have joined yet."));return}
  list.forEach(x=>{
    const r=el("div","glass prow"),d=el("div","pname");
    d.append(el("b",null,x.name||"Student"));if(x.adm)d.insertAdjacentHTML("beforeend",IC.tick);
    const fl=following.has(x.id),f=el("button","btn"+(fl?"":" main"),fl?"Following":"Follow");
    f.onclick=()=>fl?deleteDoc(doc(db,"follows",me.uid+"_"+x.id)):setDoc(doc(db,"follows",me.uid+"_"+x.id),{from:me.uid,to:x.id});
    const m=el("button","btn","Message");m.onclick=()=>openChat(x.id);
    r.append(avatar(x),d,f,m);box.append(r);
  });
}
$("q").oninput=drawPeople;
function drawInbox(){
  const box=$("inbox");if(!me)return;box.replaceChildren();
  const list=[...convs].sort((a,b)=>(b.lastAt?.seconds||0)-(a.lastAt?.seconds||0));
  if(!list.length){box.append(el("div","glass empty","No messages yet. Open Search and tap Message on someone."));return}
  list.forEach(c=>{
    const o=c.members.find(u=>u!==me.uid),pf=person(o),r=el("button","glass prow");r.type="button";
    const d=el("div","pname");d.append(el("b",null,pf.name||"Student"),el("small",null,(c.lastFrom===me.uid?"You: ":"")+(c.last||"")));
    r.append(avatar(pf),d);r.onclick=()=>openChat(o);box.append(r);
  });
}
function openChat(uid){
  chatWith=uid;show("msgs");
  $("inbox").classList.add("hidden");$("chat").classList.remove("hidden");
  $("chatName").textContent=person(uid).name||"Student";listenChat();
}
function listenChat(){
  if(unsubChat)unsubChat();
  const id=[me.uid,chatWith].sort().join("_");
  unsubChat=onSnapshot(query(collection(db,"dms",id,"messages"),orderBy("createdAt","desc"),limit(100)),
    s=>{chatErr=false;drawMsgs(s.docs.map(d=>d.data()).reverse())},
    ()=>{chatErr=true;drawMsgs([])});
}
function drawMsgs(list){
  const box=$("msgs");box.replaceChildren();
  if(!list.length)box.append(el("div","empty","Say hello."));
  list.forEach(m=>box.append(el("div","bub "+(m.from===me.uid?"me":"them"),m.text)));
  box.scrollTop=box.scrollHeight;
}
$("back").onclick=()=>{if(unsubChat){unsubChat();unsubChat=null}chatWith=null;$("chat").classList.add("hidden");$("inbox").classList.remove("hidden")};
$("mform").onsubmit=async e=>{
  e.preventDefault();const t=$("mtext").value.trim();if(!t||!chatWith)return;$("mtext").value="";
  const ids=[me.uid,chatWith].sort(),id=ids.join("_");
  try{
    await setDoc(doc(db,"dms",id),{members:ids,last:t.slice(0,80),lastAt:serverTimestamp(),lastFrom:me.uid},{merge:true});
    await addDoc(collection(db,"dms",id,"messages"),{from:me.uid,text:t,createdAt:serverTimestamp()});
    if(chatErr)listenChat();
  }catch{toast("Could not send the message")}
};

/* ---------- Admin panel ---------- */
$("admBtn").onclick=async()=>{
  $("panel").showModal();
  if(!unsubM){
    unsubM=onSnapshot(collection(db,"members"),s=>{members=s.docs.map(d=>({id:d.id,...d.data()}));drawMembers()});
    unsubB=onSnapshot(collection(db,"bans"),s=>{bans=new Set(s.docs.map(d=>d.id));drawMembers()});
  }
};
$("closeP").onclick=()=>$("panel").close();
function msg(t){$("pmsg").textContent=t}
$("savePc").onclick=async()=>{const v=$("pc").value.trim();if(v.length<4){msg("Use at least 4 characters.");return}
  try{await setDoc(doc(db,"settings","access"),{passcode:v});$("pc").value="";msg("Passcode saved. Students need it to log in.")}catch{msg("Could not save.")}};
$("saveSite").onclick=async()=>{
  try{await setDoc(doc(db,"settings","site"),{title:$("st").value.trim(),tagline:$("sg").value.trim(),bg:$("sb").value,accent:$("sa").value},{merge:true});msg("Site look saved for everyone.")}catch{msg("Could not save.")}};
function drawMembers(){
  const box=$("members");box.replaceChildren();
  if(!members.length){box.append(el("div","when","No students have logged in yet."));return}
  members.sort((a,b)=>(b.last?.seconds||0)-(a.last?.seconds||0)).forEach(m=>{
    const r=el("div","mem"),i=el("div"),b=bans.has(m.id);
    i.append(el("b",null,m.name||"Student"+(b?" (banned)":"")),el("small",null,(m.email||"")+" · last login "+(m.last?m.last.toDate().toLocaleString():"just now")));
    const bt=el("button","btn",b?"Unban":"Ban");
    bt.onclick=()=>b?deleteDoc(doc(db,"bans",m.id)):setDoc(doc(db,"bans",m.id),{name:m.name||""});
    r.append(i,bt);box.append(r);
  });
}
